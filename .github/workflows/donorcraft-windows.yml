name: Donorcraft Windows launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'crates/horizon-*/**'
      - 'packaging/icons/**'
      - 'packaging/windows/**'
      - 'tools/ci/rust-version'
      - '.github/workflows/donorcraft-windows.yml'

permissions:
  contents: read

concurrency:
  group: donorcraft-windows-launcher
  cancel-in-progress: false

jobs:
  build-wasm-std:
    name: Build shared WebAssembly standard library
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and wasm target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          components: rust-src
          targets: wasm32-unknown-unknown
      - name: Build shared wasm standard library
        run: |
          mkdir -p wasm-std
          cargo run --locked -p cargo-horizon-mod -- wasm-std wasm-std/horizon-wasm-std.wasm
      - name: Upload shared wasm standard library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Donorcraft-wasm-std
          path: wasm-std/horizon-wasm-std.wasm
          if-no-files-found: error
          retention-days: 3

  build-game-windows-x64:
    name: Build Donorcraft game client (Windows x64)
    needs: build-wasm-std
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      HORIZON_NO_AUDIO: "1"
      HORIZON_TELEMETRY_URL: "off"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rust
        name: Read pinned Rust version
        shell: pwsh
        run: |
          "version=$(Get-Content tools/ci/rust-version -Raw | ForEach-Object { $_.Trim() })" >> $env:GITHUB_OUTPUT

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: donorcraft-game-windows-x64

      - name: Build native Donorcraft game and companion tools
        run: cargo build --release --locked -p horizon-official --bin horizon-official -p horizon-client-lib --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server

      - name: Download shared WebAssembly standard library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Donorcraft-wasm-std
          path: wasm-std

      - name: Prepare game executable and verify outputs
        shell: pwsh
        run: |
          $bin = "target/release"
          Copy-Item "$bin/horizon-official.exe" "$bin/horizon-client.exe" -Force
          $required = @("horizon-client.exe", "horizon-ctl.exe", "horizon-prepare.exe", "horizon-server.exe")
          foreach ($name in $required) {
            $path = Join-Path $bin $name
            if (!(Test-Path $path)) { throw "Missing game output: $path" }
          }
          if (!(Test-Path "wasm-std/horizon-wasm-std.wasm")) { throw "Missing shared wasm standard library" }
          New-Item -ItemType Directory -Force dist/Donorcraft-Windows-x64 | Out-Null
          Copy-Item "$bin/horizon-client.exe", "$bin/horizon-ctl.exe", "$bin/horizon-prepare.exe", "$bin/horizon-server.exe" "dist/Donorcraft-Windows-x64/"
          Copy-Item "wasm-std/horizon-wasm-std.wasm" "dist/Donorcraft-Windows-x64/"
          @"
          Donorcraft Windows x64 - preliminary native build

          This is a compile-only, preliminary artifact. It is NOT a playable game or installer.
          The upstream game build also requires the original-exporters artifact, generated
          on a dedicated trusted macOS runner from locally installed Minecraft Java Edition
          files. This workflow does not generate or download that artifact, so the game
          cannot be considered launch-ready.

          Minecraft game resources must be prepared locally from a user's own legitimate
          Minecraft Java Edition copy. No Minecraft-owned assets, game JARs, or exporter
          classes are included in this artifact. Do not distribute this as a working release.
          "@ | Set-Content "dist/Donorcraft-Windows-x64/BUILD-NOTES.txt"

      - name: Upload preliminary native game build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Donorcraft-Game-Windows-x64-Preliminary
          path: dist/Donorcraft-Windows-x64/
          if-no-files-found: error
          retention-days: 14

  build-windows-x64:
    name: Build Donorcraft launcher (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      HORIZON_TELEMETRY_URL: "off"
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      HORIZON_CURSEFORGE_API_KEY: ${{ secrets.HORIZON_CURSEFORGE_API_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: launcher
          shared-key: donorcraft-windows-x64

      - name: Build launcher
        working-directory: launcher
        run: cargo build --release --locked

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "launcher/target/release/horizon-launcher.exe"
          if (!(Test-Path $exe)) {
            throw "Launcher executable was not produced: $exe"
          }
          Get-Item $exe | Format-List Name, Length, FullName

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Donorcraft-Launcher-Windows-x64
          path: launcher/target/release/horizon-launcher.exe
          if-no-files-found: error
          retention-days: 14
