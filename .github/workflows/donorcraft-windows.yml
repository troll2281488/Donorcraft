name: Donorcraft Windows launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'crates/horizon-*/**'
      - 'packaging/icons/**'
      - 'packaging/windows/**'
      - '.github/workflows/donorcraft-windows.yml'

permissions:
  contents: read

concurrency:
  group: donorcraft-windows-launcher
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Build Donorcraft launcher (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      HORIZON_TELEMETRY_URL: "off"
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      HORIZON_CURSEFORGE_API_KEY: ${{ secrets.HORIZON_CURSEFORGE_API_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: launcher
          shared-key: donorcraft-windows-x64

      - name: Build launcher
        working-directory: launcher
        run: cargo build --release --locked

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "launcher/target/release/horizon-launcher.exe"
          if (!(Test-Path $exe)) {
            throw "Launcher executable was not produced: $exe"
          }
          Get-Item $exe | Format-List Name, Length, FullName

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Donorcraft-Launcher-Windows-x64
          path: launcher/target/release/horizon-launcher.exe
          if-no-files-found: error
          retention-days: 14
